# Đẩy biến môi trường lên Vercel, chạy thủ công 1 lần, không trigger tự động.
#
# Vì sao cần: Vercel Git integration lấy biến lúc build TỪ DASHBOARD của Vercel, không
# đọc từ GitHub. Secret đặt trong GitHub mà không có workflow này thì build vẫn ra app
# không có secret — Next inline `process.env.X` literal thành `undefined`, build vẫn xanh,
# webhook trả 503 vĩnh viễn.
#
# Đây là đường LƯU GIÁ TRỊ, không phải đường deploy. Deploy đã tự động: push vào GitHub là
# Vercel build. Logic nằm ở .github/scripts/sync-vercel-env.sh, test ở
# tests/sync-vercel-env.test.mjs.
#
# Nguyên tắc an toàn — đổi một trong số thì phải nghĩ:
#   1. `workflow_dispatch` là trigger DUY NHẤT. Không thêm `push`, không thêm
#      `pull_request`. Một push bất kỳ không bao giờ tự mang secret production đi nơi khác.
#   2. Chỉ dùng `actions/checkout` (của chính GitHub) và ghim cứng theo commit SHA
#      (rule 20) để không có tag trôi nào chèn code vào job đang cầm secret.
#   3. `environment: production` — có thể bắt buộc người duyệt trước khi chạy.
#
# Cần cấu hình các GitHub secrets bắt buộc (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN              — token có quyền ghi lên project
#   VERCEL_PROJECT_ID_OR_NAME — tên hoặc id project trên Vercel
#   VERCEL_TEAM_ID            — bắt buộc nếu project thuộc team; bỏ trống nếu cá nhân
#   PAYOS_CLIENT_ID / PAYOS_API_KEY / PAYOS_CHECKSUM_KEY
#   SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY
#   ZC_PROVIDER_KEY_SECRET    — khóa AES-256-GCM (32 byte base64) mã hóa BYOK keys
# Các biến tùy chọn (nếu có trong GitHub secrets sẽ được đẩy kèm):
#   NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#   NEXT_PUBLIC_SITE_URL / NEXT_PUBLIC_ANALYTICS_WEBSITE_ID / FOUNDER_EMAILS

name: Sync Vercel env

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    # Đặt required reviewer ở Settings → Environments → production nếu muốn chặn người khác.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # actions/checkout — SHA của tag v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Đẩy biến
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT: ${{ secrets.VERCEL_PROJECT_ID_OR_NAME }}
          VERCEL_TEAM: ${{ secrets.VERCEL_TEAM_ID }}
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
          PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZC_PROVIDER_KEY_SECRET: ${{ secrets.ZC_PROVIDER_KEY_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_ANALYTICS_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_ANALYTICS_WEBSITE_ID }}
          FOUNDER_EMAILS: ${{ secrets.FOUNDER_EMAILS }}
        run: .github/scripts/sync-vercel-env.sh
